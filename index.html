<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TopGit Radar Mobile - Đọc & Nghiên Cứu Mã Nguồn AI</title>
  <meta name="description" content="Ứng dụng đọc dữ liệu TopGit & GitHub chuyên biệt cho điện thoại">
  <meta name="theme-color" content="#0b0f19">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
  <style>
    /* Mobile-first smooth touch styling */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Touch momentum scrolling */
    .touch-scroll { -webkit-overflow-scrolling: touch; }
    /* Card active state for touch */
    .touch-card:active { transform: scale(0.985); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 selection:bg-sky-500 selection:text-white">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-radar text-base"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white flex items-center gap-1.5">
            TopGit Mobile <span class="text-[10px] px-1.5 py-0.2 rounded bg-sky-500/20 text-sky-400 font-semibold">Đọc Đêm</span>
          </h1>
          <p id="totalStatsText" class="text-[11px] text-slate-400">Đang tải dữ liệu...</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Load File Button -->
        <label title="Nạp file JSON khác từ điện thoại" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium cursor-pointer border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-folder-open text-sky-400"></i> Nạp JSON
          <input type="file" id="jsonFileInput" accept=".json" onchange="handleFileSelect(event)" class="hidden">
        </label>
        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" id="themeBtn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700">
          <i class="fa-solid fa-sun text-xs text-amber-400"></i>
        </button>
      </div>
    </div>

    <!-- SEARCH BAR -->
    <div class="mt-2.5 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="Tìm kiếm tên repo, mục đích, từ khóa..." class="w-full pl-8 pr-8 py-2 rounded-xl bg-slate-800/90 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-500">
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>

    <!-- SORT SELECTOR & COUNT -->
    <div class="mt-2 flex items-center justify-between text-[11px] text-slate-400">
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-down-short-wide text-sky-400"></i>
        <span class="font-medium text-slate-300">Sắp xếp:</span>
        <select id="sortSelect" onchange="onSortChange()" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 text-xs font-semibold focus:outline-none focus:border-sky-500">
          <option value="newest" selected>🔥 Mới quét nhất (Lên đầu)</option>
          <option value="stars">⭐ Sao nhiều nhất (Hot nhất)</option>
          <option value="ai">🤖 Ưu tiên AI (OpenAI &gt;&gt; Gemini &gt;&gt; Claude)</option>
        </select>
      </div>
      <div id="filterResultCount" class="text-[11px] text-slate-400 font-medium"></div>
    </div>

    <!-- HORIZONTAL SCROLLABLE AI ECOSYSTEM PILLS -->
    <div class="mt-2.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar touch-scroll pb-1 text-xs">
      <button onclick="setFilter('all')" data-filter="all" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-sky-600 text-white shadow-sm">
        Tất cả (<span id="cnt-all">0</span>)
      </button>
      <button onclick="setFilter('new_only')" data-filter="new_only" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-rose-950/60 text-rose-300 border border-rose-600/40">
        🔥 Mới quét (<span id="cnt-new">0</span>)
      </button>
      <button onclick="setFilter('openai')" data-filter="openai" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700">
        🟢 OpenAI / ChatGPT (<span id="cnt-openai">0</span>)
      </button>
      <button onclick="setFilter('gemini')" data-filter="gemini" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700">
        🔵 Google Gemini (<span id="cnt-gemini">0</span>)
      </button>
      <button onclick="setFilter('claude')" data-filter="claude" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700">
        🟠 Claude (<span id="cnt-claude">0</span>)
      </button>
      <button onclick="setFilter('other_ai')" data-filter="other_ai" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700">
        🟣 AI Khác (<span id="cnt-other_ai">0</span>)
      </button>
      <button onclick="setFilter('fav')" data-filter="fav" class="filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700">
        ⭐ Đã thích (<span id="cnt-fav">0</span>)
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-2xl mx-auto px-3.5 py-4 space-y-3.5">

    <!-- EMPTY / WELCOME BANNER (Only when no data) -->
    <div id="emptyState" class="hidden p-6 rounded-2xl bg-slate-800/80 border border-slate-700 text-center space-y-3">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-file-arrow-up"></i>
      </div>
      <h2 class="text-base font-bold text-white">Chưa có dữ liệu kho mã nguồn</h2>
      <p class="text-xs text-slate-400 leading-relaxed max-w-sm mx-auto">
        Bạn hãy bấm nút <strong>"Nạp JSON"</strong> ở góc trên để chọn tệp <code>topgit_data.json</code> vừa quét từ máy tính, hoặc tải tệp dữ liệu vào cùng thư mục trên hosting.
      </p>
      <label class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold cursor-pointer shadow-lg shadow-sky-600/30">
        <i class="fa-solid fa-folder-open"></i> Chọn tệp JSON trên điện thoại
        <input type="file" accept=".json" onchange="handleFileSelect(event)" class="hidden">
      </label>
    </div>

    <!-- REPOSITORIES LIST -->
    <div id="repoList" class="space-y-3.5">
      <!-- Cards rendered via JavaScript -->
    </div>

  </main>

  <!-- FLOATING BACK TO TOP BUTTON -->
  <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="backToTopBtn" class="hidden fixed bottom-5 right-5 w-11 h-11 rounded-full bg-sky-600 text-white shadow-xl flex items-center justify-center text-sm z-30 transition hover:bg-sky-500">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script>
    // Embedded initial data placeholder (can be injected automatically during export)
    window.EMBEDDED_DATA = null;

    let allRepos = [];
    let currentFilter = 'all';
    let currentSort = 'newest';
    let searchQuery = '';
    let favorites = JSON.parse(localStorage.getItem('topgit_mobile_favs') || '[]');

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Try embedded data first
      if (window.EMBEDDED_DATA && window.EMBEDDED_DATA.repositories) {
        loadData(window.EMBEDDED_DATA.repositories);
        return;
      }

      // 2. Try fetching data.json or topgit_data.json in same folder (for cPanel hosting)
      const tryFiles = ['data.json', 'topgit_data.json', 'topgit_export.json'];
      let loaded = false;
      for (const fname of tryFiles) {
        try {
          const res = await fetch(fname);
          if (res.ok) {
            const data = await res.json();
            const repos = data.repositories || data.items || data;
            if (Array.isArray(repos) && repos.length > 0) {
              loadData(repos);
              loaded = true;
              break;
            }
          }
        } catch (e) {
          // ignore network fetch error when opening locally
        }
      }

      // 3. Try localStorage cache
      if (!loaded) {
        const cached = localStorage.getItem('topgit_last_scanned_cache');
        if (cached) {
          try {
            const repos = JSON.parse(cached);
            if (Array.isArray(repos) && repos.length > 0) {
              loadData(repos);
              loaded = true;
            }
          } catch (e) {}
        }
      }

      if (!loaded) {
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('totalStatsText').innerText = 'Chưa nạp dữ liệu';
      }
    });

    function loadData(repos) {
      allRepos = repos;
      document.getElementById('emptyState').classList.add('hidden');
      localStorage.setItem('topgit_last_scanned_cache', JSON.stringify(repos));
      updateCounts();
      renderList();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          const repos = data.repositories || data.items || data;
          if (Array.isArray(repos)) {
            loadData(repos);
            alert('✅ Đã nạp thành công ' + repos.length + ' kho mã nguồn vào điện thoại!');
          } else {
            alert('⚠️ Định dạng tệp JSON không hợp lệ!');
          }
        } catch (err) {
          alert('❌ Lỗi đọc tệp JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function updateCounts() {
      const total = allRepos.length;
      document.getElementById('totalStatsText').innerText = total + ' kho mã nguồn đã quét';
      document.getElementById('cnt-all').innerText = total;

      let cntOpenAI = 0, cntGemini = 0, cntClaude = 0, cntOther = 0;
      allRepos.forEach(r => {
        const eco = (r.ai_ecosystem || '').toLowerCase();
        if (eco.includes('openai') || eco.includes('chatgpt')) cntOpenAI++;
        else if (eco.includes('gemini') || eco.includes('google')) cntGemini++;
        else if (eco.includes('claude') || eco.includes('anthropic')) cntClaude++;
        else cntOther++;
      });

      document.getElementById('cnt-openai').innerText = cntOpenAI;
      document.getElementById('cnt-gemini').innerText = cntGemini;
      document.getElementById('cnt-claude').innerText = cntClaude;
      document.getElementById('cnt-other_ai').innerText = cntOther;
      document.getElementById('cnt-fav').innerText = favorites.length;
      const cntNew = allRepos.filter(r => r.is_new_in_last_scan || (r.stars_growth && r.stars_growth.includes('Mới'))).length;
      document.getElementById('cnt-new').innerText = cntNew;
    }

    function onSortChange() {
      currentSort = document.getElementById('sortSelect').value;
      renderList();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-sky-600 text-white shadow-sm';
        } else {
          btn.className = 'filter-pill px-3 py-1 rounded-full whitespace-nowrap font-medium text-xs bg-slate-800 text-slate-300 border border-slate-700';
        }
      });
      renderList();
    }

    function onSearchInput() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderList();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderList();
    }

    function toggleFav(id, event) {
      if (event) event.stopPropagation();
      const numId = Number(id);
      if (favorites.includes(numId)) {
        favorites = favorites.filter(x => x !== numId);
      } else {
        favorites.push(numId);
      }
      localStorage.setItem('topgit_mobile_favs', JSON.stringify(favorites));
      document.getElementById('cnt-fav').innerText = favorites.length;
      renderList();
    }

    function copyLink(url, event) {
      if (event) event.stopPropagation();
      navigator.clipboard.writeText(url).then(() => {
        alert('📋 Đã sao chép link GitHub!');
      }).catch(() => {
        alert('Link: ' + url);
      });
    }

    function getEcoBadge(eco) {
      const e = (eco || '').toLowerCase();
      if (e.includes('openai') || e.includes('chatgpt')) {
        return '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"><i class="fa-solid fa-robot mr-1"></i> OpenAI #1</span>';
      } else if (e.includes('gemini') || e.includes('google')) {
        return '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30"><i class="fa-solid fa-sparkles mr-1"></i> Gemini #2</span>';
      } else if (e.includes('claude') || e.includes('anthropic')) {
        return '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30"><i class="fa-solid fa-brain mr-1"></i> Claude #3</span>';
      } else if (e.includes('khác') || e.includes('other')) {
        return '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30"><i class="fa-solid fa-microchip mr-1"></i> AI Khác #4</span>';
      } else {
        return '<span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-700/50 text-slate-400 border border-slate-600/30">Tiện ích #5</span>';
      }
    }

    function renderList() {
      const container = document.getElementById('repoList');
      let filtered = allRepos.slice();

      // 1. Ecosystem / Favorite / New filter
      if (currentFilter === 'new_only') {
        filtered = filtered.filter(r => r.is_new_in_last_scan || (r.stars_growth && r.stars_growth.includes('Mới')));
      } else if (currentFilter === 'openai') {
        filtered = filtered.filter(r => (r.ai_ecosystem || '').toLowerCase().includes('openai') || (r.ai_ecosystem || '').toLowerCase().includes('chatgpt'));
      } else if (currentFilter === 'gemini') {
        filtered = filtered.filter(r => (r.ai_ecosystem || '').toLowerCase().includes('gemini') || (r.ai_ecosystem || '').toLowerCase().includes('google'));
      } else if (currentFilter === 'claude') {
        filtered = filtered.filter(r => (r.ai_ecosystem || '').toLowerCase().includes('claude') || (r.ai_ecosystem || '').toLowerCase().includes('anthropic'));
      } else if (currentFilter === 'other_ai') {
        filtered = filtered.filter(r => (r.ai_ecosystem || '').toLowerCase().includes('khác') || (r.ai_ecosystem || '').toLowerCase().includes('other'));
      } else if (currentFilter === 'fav') {
        filtered = filtered.filter(r => favorites.includes(Number(r.id)));
      }

      // 2. Search query filter
      if (searchQuery) {
        filtered = filtered.filter(r => {
          const txt = (r.repo_name + ' ' + (r.title || '') + ' ' + (r.purpose_summary || '') + ' ' + (r.practical_use || '') + ' ' + (r.description || '')).toLowerCase();
          return txt.includes(searchQuery);
        });
      }

      // 3. SẮP XẾP: MẶC ĐỊNH ĐƯA CÁC MỤC MỚI QUÉT LÊN ĐẦU TIÊN
      if (currentSort === 'newest') {
        filtered.sort((a, b) => {
          // Ưu tiên 1: Repo đánh dấu mới quét lên đầu
          const aNew = a.is_new_in_last_scan ? 1 : 0;
          const bNew = b.is_new_in_last_scan ? 1 : 0;
          if (aNew !== bNew) return bNew - aNew;

          // Ưu tiên 2: Thời gian cập nhật gần nhất
          const aTime = new Date(a.last_updated_at || a.first_seen_at || 0).getTime();
          const bTime = new Date(b.last_updated_at || b.first_seen_at || 0).getTime();
          if (aTime !== bTime) return bTime - aTime;

          // Ưu tiên 3: ID cao hơn (quét sau) lên trước
          return (b.id || 0) - (a.id || 0);
        });
      } else if (currentSort === 'stars') {
        filtered.sort((a, b) => (b.stars || 0) - (a.stars || 0));
      } else if (currentSort === 'ai') {
        filtered.sort((a, b) => (a.ai_priority || 5) - (b.ai_priority || 5) || (b.stars || 0) - (a.stars || 0));
      }

      const resCountEl = document.getElementById('filterResultCount');
      if (resCountEl) resCountEl.innerText = filtered.length + ' kho';

      // 2. Search query filter
      if (searchQuery) {
        filtered = filtered.filter(r => {
          const txt = (r.repo_name + ' ' + (r.title || '') + ' ' + (r.purpose_summary || '') + ' ' + (r.practical_use || '') + ' ' + (r.description || '')).toLowerCase();
          return txt.includes(searchQuery);
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-500 text-xs"><i class="fa-solid fa-magnifying-glass text-2xl mb-2 block text-slate-600"></i>Không tìm thấy kho mã nguồn nào phù hợp.</div>';
        return;
      }

      let html = '';
      filtered.forEach((r, idx) => {
        const isFav = favorites.includes(Number(r.id));
        const ecoBadge = getEcoBadge(r.ai_ecosystem);
        const purposeVi = r.purpose_summary || 'Chưa có bản tóm tắt tiếng Việt.';
        const practicalUse = r.practical_use || 'Dùng tham khảo mã nguồn, tích hợp API hoặc chạy trực tiếp theo README.';
        const starsText = r.stars_text || (r.stars ? r.stars.toLocaleString() : '0');
        const starsGrowth = r.stars_growth ? '<span class="text-[11px] text-emerald-400 font-bold ml-1.5">' + r.stars_growth + '</span>' : '';
        const lang = r.language ? '<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px] font-medium border border-slate-700">' + r.language + '</span>' : '';
        const ghUrl = r.github_url || ('https://github.com/' + r.repo_name);

        html += '<article class="touch-card p-4 rounded-2xl bg-slate-800/90 border border-slate-700/80 shadow-md space-y-3 transition">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="flex-1 min-w-0">' +
              '<div class="flex items-center gap-2 flex-wrap mb-1">' + ((r.is_new_in_last_scan || (r.stars_growth && r.stars_growth.includes('Mới'))) ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-black bg-rose-500/20 text-rose-300 border border-rose-500/40 flex items-center gap-1 shadow-sm"><i class="fa-solid fa-fire text-rose-400"></i> MỚI CẬP NHẬT</span>' : '') +
                ecoBadge +
                lang +
                '<span class="text-xs text-amber-400 font-bold flex items-center gap-0.5"><i class="fa-solid fa-star text-[10px]"></i> ' + starsText + starsGrowth + '</span>' +
              '</div>' +
              '<h3 class="text-sm font-bold text-white truncate">' +
                '<a href="' + ghUrl + '" target="_blank" class="hover:text-sky-400 transition flex items-center gap-1.5">' +
                  '<i class="fa-brands fa-github text-slate-400"></i> ' + r.repo_name +
                '</a>' +
              '</h3>' +
            '</div>' +
            '<button onclick="toggleFav(' + r.id + ', event)" class="w-8 h-8 rounded-lg ' + (isFav ? 'text-amber-400 bg-amber-500/10' : 'text-slate-400 hover:text-amber-400 bg-slate-700/50') + ' flex items-center justify-center transition">' +
              '<i class="' + (isFav ? 'fa-solid' : 'fa-regular') + ' fa-star text-sm"></i>' +
            '</button>' +
          '</div>' +

          // CÔNG CỤ PHỤC VỤ GÌ (100% TIẾNG VIỆT)
          '<div class="p-3 rounded-xl bg-slate-900/80 border border-slate-700/60 space-y-1.5">' +
            '<div class="text-[11px] font-bold text-sky-400 uppercase tracking-wide flex items-center gap-1">' +
              '<i class="fa-solid fa-bullseye"></i> Công cụ phục vụ gì (Tiếng Việt):' +
            '</div>' +
            '<p class="text-xs text-slate-200 leading-relaxed">' + purposeVi + '</p>' +
          '</div>' +

          // ỨNG DỤNG THỰC TẾ
          '<div class="p-2.5 rounded-xl bg-emerald-950/20 border border-emerald-900/40 text-xs space-y-1">' +
            '<div class="text-[11px] font-bold text-emerald-400 flex items-center gap-1">' +
              '<i class="fa-solid fa-lightbulb"></i> Khả năng ứng dụng thực tế:' +
            '</div>' +
            '<p class="text-[11px] text-emerald-200/90 leading-relaxed">' + practicalUse + '</p>' +
          '</div>' +

          // BOTTOM ACTIONS
          '<div class="flex items-center justify-between pt-1 border-t border-slate-700/50 text-xs">' +
            '<button onclick="copyLink(this.dataset.url, event)" data-url="' + ghUrl + '" class="text-slate-400 hover:text-slate-200 flex items-center gap-1 text-[11px]">' +
              '<i class="fa-regular fa-copy"></i> Sao chép link' +
            '</button>' +
            '<a href="' + ghUrl + '" target="_blank" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs flex items-center gap-1.5 shadow-sm">' +
              'Mở GitHub <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>' +
            '</a>' +
          '</div>' +
        '</article>';
      });

      container.innerHTML = html;
    }

    // Scroll to top button toggle
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTopBtn');
      if (window.scrollY > 300) btn.classList.remove('hidden');
      else btn.classList.add('hidden');
    });

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const btn = document.getElementById('themeBtn');
      if (isDark) {
        document.body.className = 'bg-slate-900 text-slate-100 min-h-screen pb-20 selection:bg-sky-500 selection:text-white';
        btn.innerHTML = '<i class="fa-solid fa-sun text-xs text-amber-400"></i>';
      } else {
        document.body.className = 'bg-slate-100 text-slate-900 min-h-screen pb-20 selection:bg-sky-500 selection:text-white';
        btn.innerHTML = '<i class="fa-solid fa-moon text-xs text-slate-600"></i>';
      }
    }
  </script>
</body>
</html>

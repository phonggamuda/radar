name: TopGit Radar Auto-Scan (Pure GitHub)

on:
  schedule:
    # Chạy tự động lúc 23:00 UTC = 06:00 sáng giờ Việt Nam hàng ngày
    - cron: '0 23 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bất cứ lúc nào từ điện thoại/máy tính

permissions:
  contents: write

jobs:
  scan-and-update-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scanner & Generate Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cron_scraper.py

      - name: Commit & Push New Data Directly to GitHub
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-update TopGit Radar scan [skip ci]" || echo "No changes to commit"
          # Tự động đồng bộ các thay đổi mới trên GitHub trước khi push để tránh lỗi [rejected] fetch first
          git pull --rebase origin main || git pull --rebase -X theirs origin main
          git push origin main
